<div id="mainSlider"
     class="carousel slide carousel-fade mb-5"
     data-bs-ride="carousel">

    <!-- Indicators -->
    <div class="carousel-indicators">

        {% for variant in variants %}

            <button type="button"
                    data-bs-target="#mainSlider"
                    data-bs-slide-to="{{ forloop.counter0 }}"
                    class="{% if forloop.first %}active{% endif %}">
            </button>

        {% endfor %}

    </div>

    <!-- Slides -->
    <div class="carousel-inner rounded-4 shadow">

        {% for variant in variants %}

            <div class="carousel-item {% if forloop.first %}active{% endif %}">

                {% if variant.image %}
                    <img src="{{ variant.image.image.url }}"
                         class="d-block w-100"
                         style="height:550px; object-fit:cover;">
                {% else %}
                    <img src="{{ variant.product.image.url }}"
                         class="d-block w-100"
                         style="height:550px; object-fit:cover;">
                {% endif %}

                <!-- Overlay -->
                <div class="position-absolute top-0 start-0 w-100 h-100"
                     style="background:rgba(0,0,0,0.45)">
                </div>

                <!-- Caption -->
                <div class="carousel-caption d-flex flex-column justify-content-center h-100">

                    <h1 class="fw-bold display-5">

                        {{ variant.title }}

                    </h1>

                    <p class="lead">

                        {{ variant.product.description }}

                    </p>

                    <div class="mt-3">

                        <a href="{{ variant.get_absolute_url }}"
                           class="btn btn-light btn-lg px-4 rounded-3">

                            Ürünü İncele

                        </a>

                    </div>

                </div>

            </div>

        {% endfor %}

    </div>

    <!-- Prev -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#mainSlider"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <!-- Next -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#mainSlider"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>
