<div class="ps-lg-4">

    <!-- TITLE -->
    <h1 class="fw-bold mb-3">
        {{ active_variant.title }}
    </h1>

    <!-- STOCK -->
    <div class="mb-3">
        <span class="badge bg-success px-3 py-2">
            Stok: {{ active_variant.quantity }}
        </span>
    </div>

    <!-- PRICE -->
    <h2 class="fw-bold text-dark mb-4">
        ₺{{ active_variant.price }}
    </h2>

    <!-- ATTRIBUTES -->
    {% for attribute_name, values in attribute_groups.items %}

    <div class="mb-4">

        <label class="form-label fw-semibold">
            {{ attribute_name }}
        </label>

        <div class="d-flex flex-wrap gap-2">

            {% for value in values %}

                {% if value.color_code %}

                    <button
                        type="button"
                        class="attribute-btn rounded-circle border
                        {% if value.id in active_attributes %}active-attribute{% endif %}"
                        data-attribute="{{ attribute_name }}"
                        data-value="{{ value.id }}"
                        title="{{ value.value }}"
                        style="width:40px;height:40px;background-color:{{ value.color_code }};">
                    </button>

                {% else %}

                    <button
                        type="button"
                        class="btn attribute-btn
                        {% if value.id in active_attributes %}btn-dark{% else %}btn-outline-dark{% endif %}"
                        data-attribute="{{ attribute_name }}"
                        data-value="{{ value.id }}">
                        {{ value.value }}
                    </button>

                {% endif %}

            {% endfor %}

        </div>

    </div>

    {% endfor %}

    <!-- ADD TO CART -->
    <form method="post" action="{% url 'addtoshopcart' %}">
        {% csrf_token %}

        <input type="hidden" name="variantid" value="{{ active_variant.id }}">

        <div class="mb-4">
            <label class="form-label fw-semibold">Adet</label>
            <input type="number" name="quantity" value="1" min="1" class="form-control w-25">
        </div>

        <button class="btn btn-dark btn-lg rounded-pill px-5">
            Sepete Ekle
        </button>

    </form>

</div>
